<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060B14;color:#E2E8F0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;font-size:15px}
#topbar{background:#0D1526;border-bottom:1px solid #1E2D4A;padding:12px 16px;position:sticky;top:0;z-index:90}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row .card{flex:1;min-width:110px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}
.btn,.btn-g,.btn-d,.btn-w,.btn-s{border:none;border-radius:7px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:12px;font-family:inherit;transition:opacity .15s;white-space:nowrap}
.btn{background:#F0B429;color:#060B14}

.sip-card{border:1px solid #1E2D4A;border-radius:10px;padding:14px;margin-bottom:10px}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-bar select,.srch-inp{background:#0D1526;border:1px solid #1E2D4A;border-radius:7px;padding:7px 11px;color:#E2E8F0;font-size:12px;font-family:inherit;outline:none}

.srch-inp:focus{border-color:#F0B429}
.bud-row{margin-bottom:8px;padding:12px 14px}
.bud-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.bud-inp{width:85px;background:#060B14;border:1px solid #1E2D4A;border-radius:6px;padding:4px 8px;color:#E2E8F0;font-size:12px;font-family:inherit}
.chart-wrap{position:relative;width:100%;height:160px}
.chart-wrap-sm{position:relative;width:100%;height:130px}
.empty{text-align:center;padding:32px 0;color:#64748B;font-size:12px}
.legend{display:flex;gap:12px;margin-top:7px;justify-content:center;flex-wrap:wrap}
.legend span{font-size:10px;color:#64748B;display:flex;align-items:center;gap:4px}
.legend i{width:7px;height:7px;border-radius:2px;display:inline-block}
.rpt-bar-wrap{width:100%;height:10px;background:#1E2D4A;border-radius:5px;overflow:hidden;margin-top:4px}
.rpt-bar-fill{height:100%;border-radius:5px;transition:width .3s}
.green{color:#10B981}.red{color:#EF4444}.gold{color:#F0B429}.muted{color:#64748B}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}

.cc-pay-badge{background:#EF444420;border:1px solid #EF4444;border-radius:6px;padding:3px 8px;font-size:10px;color:#EF4444;font-weight:600}
</style>

<script>
// ── CONSTANTS ──────────────────────────────────────────────────────────
const CATS=[
  {name:'Food & Dining',    emoji:'🍔',color:'#F59E0B',fixed:false},
  {name:'Groceries',        emoji:'🛒',color:'#84CC16',fixed:false},
  {name:'Transport',        emoji:'🚗',color:'#3B82F6',fixed:false},
  {name:'Fuel',             emoji:'⛽',color:'#F97316',fixed:false},
  {name:'Shopping',         emoji:'🛍️',color:'#8B5CF6',fixed:false},
  {name:'Bills & Utilities',emoji:'💡',color:'#EC4899',fixed:true},
  {name:'Entertainment',    emoji:'🎬',color:'#F97316',fixed:false},
  {name:'Health',           emoji:'💊',color:'#10B981',fixed:false},
  {name:'Education',        emoji:'📚',color:'#06B6D4',fixed:false},
  {name:'Travel',           emoji:'✈️',color:'#84CC16',fixed:false},
  {name:'Housing',          emoji:'🏠',color:'#EF4444',fixed:true},
  {name:'Personal Care',    emoji:'💆',color:'#A78BFA',fixed:false},
  {name:'Smoke & Drinks',   emoji:'🚬',color:'#94A3B8',fixed:false},
  {name:'Gifts',            emoji:'🎁',color:'#FB7185',fixed:false},
  {name:'EMI',              emoji:'🏛️',color:'#EF4444',fixed:true},
  {name:'Other',            emoji:'💰',color:'#6B7280',fixed:false}
];
const INV_TYPES=['Mutual Fund','Stocks','Fixed Deposit','PPF/EPF','Gold','Crypto','Real Estate','Other'];
const ACC_TYPES=['Savings','Current','Wallet (UPI)','Cash','Credit Card'];
const ACC_ICONS={'Savings':'🏦','Current':'🏢','Wallet (UPI)':'📱','Cash':'💵','Credit Card':'💳'};
const INV_COLORS=['#F59E0B','#3B82F6','#10B981','#8B5CF6','#EC4899','#F97316','#06B6D4','#84CC16'];
const LOAN_TYPES=['Home Loan','Car Loan','Personal Loan','Education Loan','Business Loan','Gold Loan','Other'];
const INC_SOURCES=['Salary','Freelance','Business','Investment Returns','Rental','Bonus','Gift','Other'];
const FREQ=['monthly','quarterly','annually'];

// ── STATE ──────────────────────────────────────────────────────────────
const EMPTY={accounts:[],expenses:[],income:[],investments:[],budgets:{},
             loans_borrowed:[],loans_given:[],recurring:[],sips:[]};
let S=(()=>{try{return{...EMPTY,...JSON.parse(localStorage.getItem('fv5')||'{}')};}catch{return{...EMPTY};}})();
// migrate old key
(()=>{['fv4','fv3'].forEach(k=>{const d=localStorage.getItem(k);if(d&&!localStorage.getItem('fv5')){try{S={...EMPTY,...JSON.parse(d)};save();}catch{}}});})();
const save=()=>localStorage.setItem('fv5',JSON.stringify(S));

// ── UI STATE ───────────────────────────────────────────────────────────
let currentTab='dashboard';
let charts={};
let expFilter={month:thisYM(),cat:'All',q:''};
let incFilter={month:thisYM()};
let loanSub='borrowed';
let invSub='holdings';
let reportPeriod='month';
let reportTrendCat=CATS[0].name;
let newsSrc='ET Markets';
let newsCache={};
let editingId=null,editingType=null;

// ── HELPERS ────────────────────────────────────────────────────────────
function fmt(n){return '₹'+Math.round(n||0).toLocaleString('en-IN');}
function fmtN(n){return Math.round(n||0).toLocaleString('en-IN');}
function today(){return new Date().toISOString().split('T')[0];}
function thisYM(){return new Date().toISOString().slice(0,7);}
function ym(d){return (d||'').slice(0,7);}
function uid(){return Math.random().toString(36).slice(2,9);}
function catObj(name){return CATS.find(c=>c.name===name)||CATS[CATS.length-1];}
function g(id){return document.getElementById(id)?.value||'';}
function monthsElapsed(startDate){
  const s=new Date(startDate+'T00:00:00'),n=new Date();
  return Math.max(0,(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth()));
}
function mkChart(id,cfg){
  if(charts[id]){try{charts[id].destroy();}catch{}}
  const el=document.getElementById(id);
  if(!el)return;
  charts[id]=new Chart(el,cfg);
}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch{}});charts={};}
function periodDates(p){
  const n=new Date(),y=n.getFullYear(),mo=n.getMonth();
  const s={
    week:new Date(n-7*864e5),
    month:new Date(y,mo,1),
    quarter:new Date(y,Math.floor(mo/3)*3,1),
    year:new Date(y,0,1)
  };
  return {start:s[p]||s.month,end:n};
}
function inPeriod(dateStr,p){
  const {start,end}=periodDates(p);
  const d=new Date(dateStr+'T00:00:00');
  return d>=start&&d<=end;
}
function last12Months(){
  return Array.from({length:12},(_,i)=>{
    const d=new Date();d.setMonth(d.getMonth()-(11-i));
    return {ym:d.toISOString().slice(0,7),label:d.toLocaleString('default',{month:'short'})};
  });
}

// ── LOAN MATH ──────────────────────────────────────────────────────────
function calcEMI(P,r,n){if(r===0)return P/n;const pw=Math.pow(1+r,n);return P*r*pw/(pw-1);}
function loanStats(l){
  const P=+l.amount,r=(+l.roi/100)/12,n=+l.tenure;
  const emi=calcEMI(P,r,n);
  const k=Math.min(monthsElapsed(l.startDate),n);
  const outstanding=Math.max(0,r===0?P-emi*k:P*Math.pow(1+r,k)-emi*((Math.pow(1+r,k)-1)/r));
  const principalPaid=P-outstanding;
  const interestPaid=Math.max(0,emi*k-principalPaid);
  return {emi,paid:k,left:Math.max(0,n-k),outstanding,principalPaid,interestPaid,
          totalInterest:emi*n-P,pctDone:n>0?(k/n)*100:0};
}
function loanGivenStats(l){
  const k=monthsElapsed(l.startDate),roi=+l.roi||0;
  const interest=roi>0?(+l.amount*(roi/100/12)*k):0;
  return {amountGiven:+l.amount,interestAccrued:interest,totalDue:+l.amount+interest,months:k};
}

// ── COMPUTED ───────────────────────────────────────────────────────────
function computed(){
  const m=thisYM();
  const mExp=S.expenses.filter(e=>ym(e.date)===m);
  const mInc=S.income.filter(i=>ym(i.date)===m);
  const liquid=S.accounts.reduce((s,a)=>s+(a.type==='Credit Card'?-1:1)*(+a.balance||0),0);
  const invCost=S.investments.reduce((s,i)=>s+(+i.invested||0),0)
               +S.sips.reduce((s,p)=>s+(+p.monthlyAmount||0)*Math.min(monthsElapsed(p.startDate),(+p.months||999)),0);
  const invVal=S.investments.reduce((s,i)=>s+(+i.currentValue||0),0)
              +S.sips.reduce((s,p)=>s+(+p.currentValue||0),0);
  const totalExp=mExp.reduce((s,e)=>s+e.amount,0);
  const totalInc=mInc.reduce((s,i)=>s+i.amount,0);
  const saveRate=totalInc>0?((totalInc-totalExp)/totalInc)*100:0;
  const catBreak=CATS.map(c=>({...c,total:mExp.filter(e=>e.category===c.name).reduce((s,e)=>s+e.amount,0)})).filter(c=>c.total>0);
  const loanLiability=S.loans_borrowed.reduce((s,l)=>s+loanStats(l).outstanding,0);
  const loanAsset=S.loans_given.reduce((s,l)=>s+loanGivenStats(l).totalDue,0);
  const totalEMI=S.loans_borrowed.reduce((s,l)=>{const st=loanStats(l);return st.left>0?s+st.emi:s;},0);
  const recCommitted=S.recurring.filter(r=>r.active&&r.frequency==='monthly').reduce((s,r)=>s+(+r.amount||0),0);
  const recPaidAmt=S.recurring.filter(r=>r.active&&recPaidThisMonth(r.id)).reduce((s,r)=>s+(+r.amount||0),0);
  const netWorth=liquid+invVal-loanLiability+loanAsset;
  return {m,mExp,mInc,liquid,invCost,invVal,totalExp,totalInc,saveRate,catBreak,
          loanLiability,loanAsset,totalEMI,recCommitted,recPaidAmt,netWorth,invGain:invVal-invCost};
}

function recPaidThisMonth(id){return S.expenses.some(e=>e.recurringId===id&&ym(e.date)===thisYM());}
function sipLoggedThisMonth(sip){return (sip.logs||[]).includes(thisYM());}

// ── NAVIGATION ─────────────────────────────────────────────────────────
function go(tab){
  currentTab=tab;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  renderMain();
}
function renderMain(){
  destroyCharts();
  const c=computed();
  document.getElementById('nw-badge').textContent='Net Worth: '+fmt(c.netWorth);
  const fn={dashboard:rDash,expenses:rExp,income:rInc,investments:rInv,accounts:rAcc,
             loans:rLoans,recurring:rRec,budget:rBud,reports:rRep,news:rNews};
  document.getElementById('main').innerHTML=(fn[currentTab]||rDash)(c);
  setTimeout(()=>initCharts(c),0);
}

// ── DASHBOARD ──────────────────────────────────────────────────────────
function rDash(c){
  const l12=last12Months();
  window._l12=l12;window._c=c;
  const recent=[...S.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const dueRec=S.recurring.filter(r=>r.active&&r.frequency==='monthly'&&!recPaidThisMonth(r.id));
  return `
<div id="hero" class="card mb14">
  <div class="nw-label">Total Net Worth</div>
  <div class="nw-val">${fmt(c.netWorth)}</div>
  <div class="nw-sub">
    <div class="nw-item"><div class="l">Cash</div><div class="v">${fmt(c.liquid)}</div></div>
    <div class="nw-item"><div class="l">Investments</div><div class="v green">${fmt(c.invVal)}</div></div>
    <div class="nw-item"><div class="l">Loan Due</div><div class="v red">−${fmt(c.loanLiability)}</div></div>
    <div class="nw-item"><div class="l">Receivable</div><div class="v green">+${fmt(c.loanAsset)}</div></div>
  </div>
  <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
    <button class="btn-g btn-sm" onclick="openModal('account')">+ Account</button>
    <button class="btn-g btn-sm" onclick="openModal('investment')">+ Investment</button>
    <button class="btn-g btn-sm" onclick="go('recurring')">🔁 Recurring</button>
  </div>
</div>
<div class="row">
  <div class="card"><div class="card-label">Income this month</div><div class="stat-val green">${fmt(c.totalInc)}</div></div>
  <div class="card"><div class="card-label">Spent this month</div><div class="stat-val red">${fmt(c.totalExp)}</div></div>

function rAcc(c){

  const now=new Date();
  return `

        const dueDate=dueThisMonth>=now?dueThisMonth:dueNextMonth;
        const daysLeft=Math.ceil((dueDate-now)/(1000*60*60*24));
        dueInfo=`<div style="font-size:10px;margin-top:3px;color:${daysLeft<=3?'#EF4444':daysLeft<=7?'#F0B429':'#64748B'}">Due in ${daysLeft}d (${dueDate.toLocaleDateString('en-IN',{day:'numeric',month:'short'})})</div>`;
      }
      return`<div>

          <div class="list-left"><div style="font-size:20px">${ACC_ICONS[a.type]||'💰'}</div>

          <div style="display:flex;justify-content:space-between;font-size:10px;color:#64748B;margin-bottom:3px"><span>Used: ${fmt(a.balance)}</span><span>Available: ${fmt(Math.max(0,avail))}</span></div>
          <div class="pbar"><div class="pbar-fill" style="width:${a.ccLimit>0?Math.min((+a.balance/+a.ccLimit)*100,100):0}%;background:${(+a.balance/+a.ccLimit)>.8?'#EF4444':(+a.balance/+a.ccLimit)>.5?'#F0B429':'#10B981'}"></div></div>

function openCCPayModal(accId){
  const acc=S.accounts.find(a=>a.id===accId);
  if(!acc)return;
  const bankOpts=S.accounts.filter(a=>a.type!=='Credit Card').map(a=>`<option value="${a.id}">${a.name} (${fmt(a.balance)})</option>`).join('');
  document.getElementById('modal-title').textContent=`Pay ${acc.name}`;
  document.getElementById('modal-body').innerHTML=`
    <div style="background:#060B14;border-radius:8px;padding:12px;margin-bottom:14px;text-align:center">
      <div style="font-size:10px;color:#64748B;margin-bottom:4px">OUTSTANDING BALANCE</div>
      <div style="font-size:28px;font-weight:800;color:#EF4444">${fmt(acc.balance)}</div>
    </div>
    <div class="field"><label>Payment Amount (₹)</label><input type="number" id="cc-pay-amt" value="${acc.balance}" min="0"></div>
    <div class="field"><label>Pay from Account</label><select id="cc-pay-from">${bankOpts||'<option value="">No bank accounts added</option>'}</select></div>
    <div class="field"><label>Date</label><input type="date" id="cc-pay-date" value="${today()}"></div>
    <button class="btn btn-full" onclick="payCreditCard('${accId}')">Confirm Payment</button>`;
  document.getElementById('modal-overlay').classList.add('open');
}
function payCreditCard(accId){
  const acc=S.accounts.find(a=>a.id===accId);
  if(!acc)return;
  const amt=parseFloat(document.getElementById('cc-pay-amt')?.value)||0;
  const fromId=document.getElementById('cc-pay-from')?.value;
  const date=document.getElementById('cc-pay-date')?.value||today();
  if(!amt||amt<=0)return alert('Enter payment amount');
  if(!fromId)return alert('Select account to pay from');
  const fromAcc=S.accounts.find(a=>a.id===fromId);
  if(!fromAcc)return;
  fromAcc.balance-=amt;
  acc.balance=Math.max(0,acc.balance-amt);
  S.expenses.push({id:uid(),amount:amt,category:'Bills & Utilities',note:`${acc.name} Payment`,date,accountId:fromId});
  markCCHandled(accId,ym(date));
  save();closeModal();renderMain();
}

function rBud(c){

  return `

${CATS.map(cat2=>{
  const spent=c.mExp.filter(e=>e.category===cat2.name).reduce((s,e)=>s+e.amount,0);

function rNews(){

  let content=arts?arts==='error'?'<div class="empty" style="color:#EF4444">Couldn\'t load news. Will work on GitHub Pages.</div>':arts.map(a=>{const m=kw.some(k=>a.title?.toLowerCase().includes(k));return`<div class="news-card ${m?'match':''}" onclick="openLink('${a.link}')">
    ${m?'<div class="news-tag">🎯 MATCHES YOUR HOLDINGS</div>':''}
    <div class="news-title">${a.title||''}</div><div class="news-desc">${a.desc||''}</div>

  if(!arts)fetchNews(newsSrc);
  return `<div class="card mb8" style="padding:8px 14px"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">

    <div style="display:flex;gap:6px;flex-wrap:wrap">${Object.keys(NEWS_FEEDS).map(s=>`<button class="src-tab ${s===newsSrc?'active':''}" onclick="newsSrc='${s}';newsCache={};renderMain()">${s}</button>`).join('')}</div>
  </div></div>${content}`;

function openLink(url){if(!url)return;const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.click();}
async function fetchNews(src){
  try{const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(NEWS_FEEDS[src])}`);const d=await r.json();
    const xml=new DOMParser().parseFromString(d.contents,'text/xml');
    newsCache[src]=Array.from(xml.querySelectorAll('item')).slice(0,20).map(el=>({
      title:el.querySelector('title')?.textContent?.replace(/\s+/g,' ').trim(),
      link:el.querySelector('link')?.nextSibling?.textContent?.trim()||el.querySelector('link')?.textContent?.trim(),
      desc:el.querySelector('description')?.textContent?.replace(/<[^>]*>/g,'').slice(0,100)+'…'
    })).filter(a=>a.title);
  }catch{newsCache[src]='error';}
  if(currentTab==='news')renderMain();
}

// ── DATA MUTATIONS ────────────────────────────────────────────────────
function del(key,id){
  // Restore account balance if expense/income linked
  if(key==='expenses'){const e=S.expenses.find(x=>x.id===id);if(e&&e.accountId){const a=S.accounts.find(a=>a.id===e.accountId);if(a)a.balance+=e.amount;}}
  if(key==='income'){const i=S.income.find(x=>x.id===id);if(i&&i.accountId){const a=S.accounts.find(a=>a.id===i.accountId);if(a)a.balance-=i.amount;}}
  S[key]=S[key].filter(x=>x.id!==id);
  save();renderMain();
}
function updBal(id,v){const a=S.accounts.find(a=>a.id===id);if(a){a.balance=parseFloat(v)||0;save();renderMain();}}
function updInv(id,v){const i=S.investments.find(i=>i.id===id);if(i){i.currentValue=parseFloat(v)||0;save();renderMain();}}
function updSIP(id,v){const p=S.sips.find(p=>p.id===id);if(p){p.currentValue=parseFloat(v)||0;save();renderMain();}}
function updBud(cat,v){S.budgets[cat]=parseFloat(v)||0;save();renderMain();}
function markRecPaid(id){
  const r=S.recurring.find(x=>x.id===id);
  if(!r||recPaidThisMonth(id))return;
  const e={id:uid(),amount:+r.amount,category:r.category,note:r.name,date:today(),accountId:r.accountId||'',recurringId:id};
  S.expenses.push(e);
  if(r.accountId){const a=S.accounts.find(a=>a.id===r.accountId);if(a){if(a.type==='Credit Card')a.balance+=+r.amount;else a.balance-=+r.amount;}}
  save();renderMain();
}
function logSIP(id){
  const p=S.sips.find(p=>p.id===id);
  if(!p||sipLoggedThisMonth(p))return;
  p.logs=[...(p.logs||[]),thisYM()];
  if(p.accountId){const a=S.accounts.find(a=>a.id===p.accountId);if(a)a.balance-=+p.monthlyAmount;}
  save();renderMain();
}

function openEdit(type,id){
  editingId=id; editingType=type;

             loan_borrow:'loans_borrowed',loan_give:'loans_given',recurring:'recurring',sip:'sips'};
  const item=S[map[type]]?.find(x=>x.id===id);
  if(!item)return;

                loan_borrow:'Edit Loan',loan_give:'Edit Loan Given',recurring:'Edit Recurring',sip:'Edit SIP'};
  document.getElementById('modal-title').textContent=titles[type]||'Edit';

// ── MODALS ───────────────────────────────────────────────────────────
function openModal(type){
  editingId=null;editingType=null;

                loan_borrow:'Add Loan Borrowed',loan_give:'Add Loan Given',recurring:'Add Recurring Item',sip:'Add SIP'};

  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>{const f=document.querySelector('#modal-body input');if(f)f.focus();},80);
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editingId=null;editingType=null;}
function overlayClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

function modalBody(type,ex){
  const v=(f,fb='')=>ex?ex[f]??fb:fb;

// ── SAVE / UPDATE ────────────────────────────────────────────────────
function saveExpense(){
  const amt=parseFloat(g('f-amt'));
  if(!amt||amt<=0)return alert('Enter a valid amount');
  const loanId=document.getElementById('f-loan-id')?.value||'';
  const obj={id:editingId||uid(),amount:amt,category:g('f-cat')||CATS[0].name,note:g('f-note'),date:g('f-date')||today(),accountId:g('f-acc')||'',loanId};
  upsert('expenses',obj);
  const accId=g('f-acc');
  if(accId&&!editingId){
    const a=S.accounts.find(a=>a.id===accId);
    if(a){
      if(a.type==='Credit Card') a.balance+=amt; // CC outstanding goes up
      else a.balance-=amt; // bank balance goes down
    }
  }
  save();closeModal();renderMain();
}
function saveIncome(){
  const amt=parseFloat(g('f-amt'));
  if(!amt||amt<=0)return alert('Enter a valid amount');
  const obj={id:editingId||uid(),amount:amt,source:g('f-src')||'Salary',note:g('f-note'),date:g('f-date')||today(),accountId:g('f-acc')||''};
  upsert('income',obj);
  const accId=g('f-acc');
  if(accId&&!editingId){const a=S.accounts.find(a=>a.id===accId);if(a)a.balance+=amt;}
  save();closeModal();renderMain();
}
function saveInvestment(){
  const name=g('f-name'),invested=parseFloat(g('f-invested'));
  if(!name||!invested)return alert('Enter name and invested amount');
  const cv=parseFloat(g('f-cv'))||invested;
  const obj={id:editingId||uid(),name,type:g('f-type')||INV_TYPES[0],invested,currentValue:cv,notes:g('f-notes'),date:g('f-date')||today()};
  upsert('investments',obj);save();closeModal();renderMain();
}
function saveAccount(){
  const name=g('f-name');
  if(!name)return alert('Enter account name');
  const type=g('f-type')||ACC_TYPES[0];
  const obj={id:editingId||uid(),name,type,balance:parseFloat(g('f-bal'))||0};
  if(type==='Credit Card'){
    obj.ccLimit=parseFloat(g('f-limit'))||0;
    obj.ccBillingDate=parseInt(g('f-billing'))||null;
    obj.ccDueDate=parseInt(g('f-due'))||null;
    obj.ccAPR=parseFloat(g('f-apr'))||0;
  }
  upsert('accounts',obj);save();closeModal();renderMain();
}
function saveLoanBorrow(){
  const name=g('f-name'),amount=parseFloat(g('f-amount')),roi=parseFloat(g('f-roi')),tenure=parseInt(g('f-tenure'));
  if(!name||!amount)return alert('Enter name and amount');
  if(isNaN(roi)||roi<0)return alert('Enter a valid interest rate');
  if(!tenure||tenure<1)return alert('Enter tenure in months');
  const obj={id:editingId||uid(),name,type:g('f-type')||LOAN_TYPES[0],amount,roi,tenure,startDate:g('f-date')||today(),
             emiDay:parseInt(g('f-emi-day'))||null,emiAccountId:g('f-emi-acc')||''};
  upsert('loans_borrowed',obj);save();closeModal();loanSub='borrowed';renderMain();
}
function saveLoanGive(){
  const name=g('f-name'),amount=parseFloat(g('f-amount'));
  if(!name||!amount)return alert('Enter name and amount');
  const obj={id:editingId||uid(),name,amount,roi:parseFloat(g('f-roi'))||0,startDate:g('f-date')||today(),note:g('f-note')};
  upsert('loans_given',obj);save();closeModal();loanSub='given';renderMain();
}
function saveRecurring(){
  const name=g('f-name'),amount=parseFloat(g('f-amount'));
  if(!name||!amount)return alert('Enter name and amount');
  const obj={id:editingId||uid(),name,category:g('f-cat')||CATS[0].name,amount,frequency:g('f-freq')||'monthly',dayOfMonth:parseInt(g('f-day'))||null,accountId:g('f-acc')||'',active:true};
  upsert('recurring',obj);save();closeModal();renderMain();
}
function saveSIP(){
  const name=g('f-name'),amt=parseFloat(g('f-amount'));
  if(!name||!amt)return alert('Enter name and monthly amount');
  const existing=S.sips.find(p=>p.id===editingId);
  const obj={id:editingId||uid(),name,fundType:g('f-type')||INV_TYPES[0],monthlyAmount:amt,startDate:g('f-date')||today(),months:parseInt(g('f-months'))||null,accountId:g('f-acc')||'',currentValue:existing?.currentValue||0,logs:existing?.logs||[]};
  upsert('sips',obj);save();closeModal();invSub='sips';renderMain();
}
function upsert(key,obj){
  const idx=S[key].findIndex(x=>x.id===obj.id);
  if(idx>=0)S[key][idx]={...S[key][idx],...obj};
  else S[key].push(obj);
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────────
function exportData(){
  const json=JSON.stringify(S,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`finvault-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  URL.revokeObjectURL(url);
}
function importData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      const known=['accounts','expenses','income','investments'];
      if(!known.some(k=>k in parsed))return alert('Not a valid FinVault backup.');
      if(!confirm('Replace ALL current data with this backup?\n\nThis cannot be undone.'))return;
      S={...EMPTY,...parsed};save();renderMain();alert('Data restored successfully.');
    }catch{alert('Could not read file. Make sure it is a FinVault JSON backup.');}
    event.target.value='';
  };
  reader.readAsText(file);
}


// ── CC LOG + NOTIFICATION ─────────────────────────────────────────────
function getCCLog(){try{return JSON.parse(localStorage.getItem('fv5_cclog')||'{}');}catch{return{};}}
function saveCCLog(log){localStorage.setItem('fv5_cclog',JSON.stringify(log));}
function ccBillingHandled(accId,monthStr){return !!getCCLog()[accId+'_'+monthStr];}
function markCCHandled(accId,monthStr){const l=getCCLog();l[accId+'_'+monthStr]=1;saveCCLog(l);}
function checkDueCCPayments(){
  const now=new Date(),pending=[];
  S.accounts.filter(a=>a.type==='Credit Card'&&a.ccBillingDate&&(+a.balance||0)>0).forEach(acc=>{
    const billingDate=new Date(now.getFullYear(),now.getMonth(),+acc.ccBillingDate);
    if(billingDate>now)return;
    const monthStr=now.toISOString().slice(0,7);
    if(!ccBillingHandled(acc.id,monthStr))pending.push({acc,monthStr});
  });
  if(pending.length===0)return;
  showCCNotifPanel(pending);
}
function showCCNotifPanel(pending){
  document.getElementById('cc-notif-panel')?.remove();
  const bankOpts=S.accounts.filter(a=>a.type!=='Credit Card').map(a=>`<option value="${a.id}">${a.name} (${fmt(a.balance)})</option>`).join('');
  const rows=pending.map(p=>{
    const now=new Date();
    const dueDate=p.acc.ccDueDate?new Date(now.getFullYear(),now.getMonth()+(now.getDate()>+p.acc.ccBillingDate?1:0),+p.acc.ccDueDate):null;
    const daysLeft=dueDate?Math.ceil((dueDate-now)/(1000*60*60*24)):null;
    return`<div style="border-bottom:1px solid #1E2D4A;padding:12px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px">
        <div><div style="font-size:13px;font-weight:700">💳 ${p.acc.name}</div>
        <div style="font-size:10px;color:${daysLeft!==null&&daysLeft<=3?'#EF4444':daysLeft<=7?'#F0B429':'#64748B'}">${daysLeft!==null?`Due in ${daysLeft} days`:'Pay before due date'}</div></div>
        <div style="font-size:17px;font-weight:800;color:#EF4444">${fmt(p.acc.balance)}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="ccnb-${p.acc.id}" style="flex:1;background:#060B14;border:1px solid #1E2D4A;border-radius:6px;padding:5px 8px;color:#E2E8F0;font-size:11px;font-family:inherit">${bankOpts||'<option value="">No bank accounts</option>'}</select>
        <button onclick="ccNotifPay('${p.acc.id}','${p.monthStr}')" style="background:#10B981;border:none;border-radius:6px;padding:5px 12px;color:#fff;font-size:11px;font-weight:700;cursor:pointer">Pay Full</button>
        <button onclick="ccNotifSkip('${p.acc.id}','${p.monthStr}')" style="background:#1E2D4A;border:none;border-radius:6px;padding:5px 10px;color:#94A3B8;font-size:11px;cursor:pointer">Remind Later</button>
      </div>
    </div>`;}).join('');
  const panel=document.createElement('div');
  panel.id='cc-notif-panel';
  panel.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#0D1526;border-top:2px solid #EF4444;z-index:149;padding:14px 16px;max-height:55vh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.5)';
  panel.innerHTML=`<div style="max-width:960px;margin:0 auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-size:13px;font-weight:700;color:#EF4444">💳 Credit Card Payment Due</span><button onclick="document.getElementById('cc-notif-panel')?.remove()" style="background:none;border:none;color:#64748B;font-size:20px;cursor:pointer">✕</button></div>${rows}</div>`;
  document.body.appendChild(panel);
  window._ccPending=pending;
}
function ccNotifPay(accId,monthStr){
  const acc=S.accounts.find(a=>a.id===accId);
  if(!acc)return;
  const fromId=document.getElementById('ccnb-'+accId)?.value;
  if(!fromId)return alert('Select a bank account to pay from');
  const fromAcc=S.accounts.find(a=>a.id===fromId);
  if(!fromAcc)return;
  const amt=+acc.balance;
  fromAcc.balance-=amt;
  acc.balance=0;
  S.expenses.push({id:uid(),amount:amt,category:'Bills & Utilities',note:`${acc.name} Payment`,date:today(),accountId:fromId});
  markCCHandled(accId,monthStr);
  save();document.getElementById('cc-notif-panel')?.remove();renderMain();
}
function ccNotifSkip(accId,monthStr){
  markCCHandled(accId,monthStr);
  const remaining=(window._ccPending||[]).filter(p=>p.acc.id!==accId);
  window._ccPending=remaining;
  if(remaining.length===0)document.getElementById('cc-notif-panel')?.remove();
  else showCCNotifPanel(remaining);
}

// emiLog tracks which loan+month combos have been handled (logged or skipped)
// Stored in localStorage separately so it persists without touching S
function getEmiLog(){try{return JSON.parse(localStorage.getItem('fv5_emilog')||'{}');}catch{return{};}}

function markEmiHandled(loanId,monthStr){const l=getEmiLog();l[loanId+'_'+monthStr]=1;saveEmiLog(l);}

function emiPaidForMonth(loanId,monthStr){
  return S.expenses.some(e=>e.loanId===loanId&&e.category==='EMI'&&ym(e.date)===monthStr);
}
function getDueEMIMonths(loan){
  if(!loan.emiDay||!loan.emiAccountId)return[];
  const start=new Date(loan.startDate+'T00:00:00');
  const now=new Date();
  const due=[];
  let cur=new Date(start.getFullYear(),start.getMonth(),1);
  let monthsFromStart=0;
  while(monthsFromStart<+loan.tenure){
    const monthStr=cur.toISOString().slice(0,7);
    const dueDate=new Date(cur.getFullYear(),cur.getMonth(),+loan.emiDay);
    if(dueDate>now)break;
    if(dueDate>=start)due.push({monthStr,dateStr:dueDate.toISOString().split('T')[0]});
    cur.setMonth(cur.getMonth()+1);
    monthsFromStart++;
  }
  return due;
}
function checkDueEMIs(){
  const pending=[];
  S.loans_borrowed.forEach(loan=>{
    if(!loan.emiDay||!loan.emiAccountId)return;
    const st=loanStats(loan);
    if(st.left<=0)return;
    getDueEMIMonths(loan).forEach(({monthStr,dateStr})=>{
      // Skip if already logged as expense OR already handled (logged/skipped)
      if(!emiPaidForMonth(loan.id,monthStr)&&!emiHandled(loan.id,monthStr))
        pending.push({loan,monthStr,dateStr,emi:Math.round(st.emi)});
    });
  });
  if(pending.length===0)return;
  showEMIPanel(pending);
}
function showEMIPanel(pending){
  // Remove any existing panel
  document.getElementById('emi-panel')?.remove();
  const acc=id=>S.accounts.find(a=>a.id===id);
  const rows=pending.map((p,i)=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1E2D4A;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-size:13px;font-weight:600">${p.loan.name}</div>
        <div style="font-size:10px;color:#64748B">${p.dateStr} · ${acc(p.loan.emiAccountId)?.name||'account'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:13px;font-weight:700;color:#F0B429">₹${p.emi.toLocaleString('en-IN')}</span>
        <button onclick="emiAction('log','${p.loan.id}','${p.monthStr}','${p.dateStr}',${p.emi},'${p.loan.emiAccountId}','${p.loan.name}')"
          style="background:#10B981;border:none;border-radius:6px;padding:5px 10px;color:#fff;font-size:11px;font-weight:700;cursor:pointer">Log & Deduct</button>
        <button onclick="emiAction('skip','${p.loan.id}','${p.monthStr}','${p.dateStr}',${p.emi},'${p.loan.emiAccountId}','${p.loan.name}')"
          style="background:#1E2D4A;border:none;border-radius:6px;padding:5px 10px;color:#94A3B8;font-size:11px;font-weight:700;cursor:pointer">Already in balance</button>
      </div>
    </div>`).join('');
  const panel=document.createElement('div');
  panel.id='emi-panel';
  panel.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#0D1526;border-top:2px solid #F0B429;z-index:150;padding:14px 16px;max-height:60vh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.5)';
  panel.innerHTML=`
    <div style="max-width:960px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><span style="font-size:13px;font-weight:700;color:#F0B429">🏛️ ${pending.length} EMI${pending.length>1?'s':''} Due</span>
        <span style="font-size:11px;color:#64748B;margin-left:8px">Choose action for each. "Already in balance" = you've already accounted for it manually.</span></div>
        <button onclick="dismissEMIPanel()" style="background:none;border:none;color:#64748B;font-size:20px;cursor:pointer;line-height:1">✕</button>
      </div>
      ${rows}
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button onclick="emiActionAll('log')" style="background:#10B981;border:none;border-radius:6px;padding:7px 14px;color:#fff;font-size:12px;font-weight:700;cursor:pointer">Log & Deduct All</button>
        <button onclick="emiActionAll('skip')" style="background:#1E2D4A;border:none;border-radius:6px;padding:7px 14px;color:#94A3B8;font-size:12px;font-weight:700;cursor:pointer">All Already in Balance</button>
      </div>
    </div>`;
  document.body.appendChild(panel);
  // Store pending for bulk actions
  window._emiPending=pending;
}
function emiAction(action,loanId,monthStr,dateStr,emi,accountId,loanName){
  if(action==='log'){
    S.expenses.push({id:uid(),amount:emi,category:'EMI',note:`${loanName} EMI`,date:dateStr,accountId,loanId});
    const a=S.accounts.find(a=>a.id===accountId);if(a)a.balance-=emi;
    save();
  }
  markEmiHandled(loanId,monthStr);
  // Remove this row from panel
  const remaining=(window._emiPending||[]).filter(p=>!(p.loan.id===loanId&&p.monthStr===monthStr));
  window._emiPending=remaining;
  if(remaining.length===0){document.getElementById('emi-panel')?.remove();renderMain();}
  else showEMIPanel(remaining);
}
function emiActionAll(action){
  (window._emiPending||[]).forEach(p=>{
    if(action==='log'){
      S.expenses.push({id:uid(),amount:p.emi,category:'EMI',note:`${p.loan.name} EMI`,date:p.dateStr,accountId:p.loan.emiAccountId,loanId:p.loan.id});
      const a=S.accounts.find(a=>a.id===p.loan.emiAccountId);if(a)a.balance-=p.emi;
    }
    markEmiHandled(p.loan.id,p.monthStr);
  });
  save();
  document.getElementById('emi-panel')?.remove();
  window._emiPending=[];
  renderMain();
}
function dismissEMIPanel(){document.getElementById('emi-panel')?.remove();}

// ── INIT ─────────────────────────────────────────────────────────────
renderMain();
setTimeout(checkDueEMIs,600);
setTimeout(checkDueCCPayments,900);
</script>
